name: Build & Release

# Analyze → test → build Android APK + iOS IPA → publish the GitHub Release
# for the version in fit/pubspec.yaml (e.g. 1.0.0 → tag v1.0.0).
#
# - Pushes to main: full pipeline + release.
# - Pull requests: analyze and test only.
# - Manual runs: Actions → "Build & Release" → Run workflow.
#
# Optional stable Android signing (lets users update without uninstalling):
# add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the APK is signed
# with a throw-away debug key.

on:
  push:
    branches: [main]
    paths:
      - 'fit/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'fit/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fit
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit, widget & performance tests
        run: flutter test
      - name: Read version
        id: version
        run: |
          echo "version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure release signing (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Using release keystore"
          else
            echo "No keystore secrets, using debug signing"
          fi
      - name: Build APK
        run: flutter build apk --release
      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/FiT-v${{ needs.test.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    name: iOS IPA (unsigned)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: fit
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS app (no code signing)
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/FiT-v${{ needs.test.outputs.version }}-unsigned.ipa" Payload
          ls -lh ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  release:
    name: Publish release
    needs: [test, android, ios]
    if: always() && github.event_name != 'pull_request' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: FiT v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            **FiT v${{ needs.test.outputs.version }}**: one app for nutrition, gym, steps and sleep, with Nebula, a coach that tells you what to do tomorrow.

            ### Android (8.0+)
            1. Download **FiT-v${{ needs.test.outputs.version }}.apk** below on your phone.
            2. Open it and allow "Install unknown apps" for your browser or Files app when asked.
            3. Optional: in Samsung Health → Settings → Health Connect, turn on sync, then tap **Train → Connect** in FiT.

            ### iPhone (iOS 15+)
            1. Download **FiT-v${{ needs.test.outputs.version }}-unsigned.ipa** below on your computer.
            2. Install it with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) using your Apple ID. A free Apple ID needs a re-install every 7 days.
            3. Optional: tap **Train → Connect** in FiT and allow Apple Health access.
