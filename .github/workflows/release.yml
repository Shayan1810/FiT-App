name: Build & Release

# Analyze → test → build Android APK + iOS IPA → publish the GitHub Release
# for the version in fit/pubspec.yaml (e.g. 1.0.0 → tag v1.0.0).
#
# - Pushes to main: full pipeline + release.
# - Pull requests: analyze and test only.
# - Manual runs: Actions → "Build & Release" → Run workflow.
#
# Android signing: every release must be signed with the same key, or phones
# can't update the app in place (they would have to uninstall and lose data).
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key)
# Optional: ANDROID_KEY_ALIAS (default "fit"), ANDROID_KEY_PASSWORD.
# Without them the build still runs, but nothing is published.

on:
  push:
    branches: [main]
    paths:
      - 'fit/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'fit/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fit
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit, widget & performance tests
        run: flutter test
      - name: Read version
        id: version
        run: |
          echo "version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: test
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Release keystore secrets are missing. The APK is built but will not be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-fit}" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build APK
        run: flutter build apk --release
      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/FiT-v${{ needs.test.outputs.version }}.apk"
      - name: Verify the release certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          # SHA-256 of FiT's permanent release certificate (public, not a secret).
          EXPECTED: 0fa745d712d4bdbf97028b1e0cb561d3b75dbd07d804e27067e9c2b84c92df38
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          ACTUAL=$("$APKSIGNER" verify --print-certs ../dist/*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Signed with $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the FiT release key."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: android
          path: dist/*.apk

  ios:
    name: iOS IPA (unsigned)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: fit
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS app (no code signing)
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/FiT-v${{ needs.test.outputs.version }}-unsigned.ipa" Payload
          ls -lh ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  release:
    name: Publish release
    needs: [test, android, ios]
    if: always() && github.event_name != 'pull_request' && needs.android.result == 'success' && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          {
            echo "## What's new"
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
            echo
            echo "### Android (8.0+)"
            echo "1. Download **FiT-v$VERSION.apk** below on your phone and open it."
            echo "2. Allow \"Install unknown apps\" for your browser or Files app when asked."
            echo "3. Updating from v2.1.0 or later installs over the old version and keeps all your data."
            echo
            echo "### iPhone (iOS 15+)"
            echo "1. Download **FiT-v$VERSION-unsigned.ipa** below on your computer."
            echo "2. Install it with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) using your Apple ID."
          } > notes.md
          cat notes.md
      - run: ls -lh dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: FiT v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body_path: notes.md
