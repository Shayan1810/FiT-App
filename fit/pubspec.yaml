name: Fit
description: "MDG Nebula Project"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0

  # hive database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # for picking profile picture
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # hive database generators
  build_runner: ^2.4.15
  hive_generator: ^2.0.1

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # assets:
    
  fonts:
    - family: Poppins
      fonts: 
        - asset: fonts/Poppins-bold.ttf
          weight: 700
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
